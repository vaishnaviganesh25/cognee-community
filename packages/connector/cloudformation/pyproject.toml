[project]
name = "cognee-community-connector-cloudformation"
version = "0.1.0"
description = "AWS CloudFormation data-source connector for cognee — sync your stacks into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Table-scoped document cleanup (DOCUMENT_SYNC_VERSION) and per-source dlt
    # pipeline scoping (PIPELINE_SCOPE_ATTR) ship in cognee 1.6.x.
    "cognee==1.6.2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # Wide lower bound so the resolver can still satisfy cognee[aws], which pins
    # s3fs (and through it botocore) to an older release.
    "boto3>=1.34.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "moto[cloudformation]>=5,<6",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_cloudformation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
